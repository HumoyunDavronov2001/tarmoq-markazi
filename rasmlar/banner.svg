<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="TARMOQ MARKAZI — MikroTik va kameralarni bitta markazdan kuzatish">
  <defs>
    <linearGradient id="fon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#0f1b36"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tor" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <style>
      .sarlavha{font:800 54px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#f8fafc;letter-spacing:1px}
      .izoh{font:500 22px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#94a3b8}
      .teg{font:600 15px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#cbd5e1}
      .tugun{font:700 13px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#e2e8f0}
      .kichik{font:600 12px 'DejaVu Sans Mono',Consolas,monospace;fill:#64748b}
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#fon)"/>
  <rect width="1280" height="360" fill="url(#tor)" opacity=".55"/>

  <g transform="translate(64 0)">
    <rect x="0" y="70" width="56" height="56" rx="14" fill="#3b82f6"/>
    <g transform="translate(28 98)" stroke="#eff6ff" stroke-width="3" fill="none" stroke-linecap="round">
      <circle r="5" fill="#eff6ff"/>
      <path d="M0 -6V-16M0 6V16M-6 0H-16M6 0H16"/>
    </g>
    <text class="sarlavha" x="0" y="190">TARMOQ MARKAZI</text>
    <text class="izoh" x="0" y="232">MikroTik · WireGuard tunnel · kamera rasmlari · VPN</text>
    <g transform="translate(0 270)">
      <rect width="112" height="30" rx="15" fill="#1e293b"/><text class="teg" x="56" y="20" text-anchor="middle">TypeScript</text>
      <rect x="122" width="82" height="30" rx="15" fill="#1e293b"/><text class="teg" x="163" y="20" text-anchor="middle">Fastify</text>
      <rect x="214" width="96" height="30" rx="15" fill="#1e293b"/><text class="teg" x="262" y="20" text-anchor="middle">React 19</text>
      <rect x="320" width="112" height="30" rx="15" fill="#1e293b"/><text class="teg" x="376" y="20" text-anchor="middle">PostgreSQL</text>
      <rect x="442" width="112" height="30" rx="15" fill="#1e293b"/><text class="teg" x="498" y="20" text-anchor="middle">WireGuard</text>
    </g>
  </g>

  <!-- Markaz va obyektlar: tunnel bo'ylab paketlar (SMIL) -->
  <g>
    <circle cx="1010" cy="180" r="120" fill="url(#halo)">
      <animate attributeName="r" values="100;130;100" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- tunnellar -->
    <g stroke="#334155" stroke-width="2" stroke-dasharray="6 6" fill="none">
      <path id="t1" d="M1010 180 L820 80"/>
      <path id="t2" d="M1010 180 L800 250"/>
      <path id="t3" d="M1010 180 L1200 70"/>
      <path id="t4" d="M1010 180 L1215 260"/>
      <path id="t5" d="M1010 180 L1010 320"/>
    </g>
    <g stroke="#3b82f6" stroke-width="2" fill="none" stroke-dasharray="6 6">
      <path d="M1010 180 L820 80"><animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/></path>
      <path d="M1010 180 L1200 70"><animate attributeName="stroke-dashoffset" values="0;-24" dur="1.2s" repeatCount="indefinite"/></path>
      <path d="M1010 180 L1215 260"><animate attributeName="stroke-dashoffset" values="0;-24" dur="0.9s" repeatCount="indefinite"/></path>
      <path d="M1010 180 L1010 320"><animate attributeName="stroke-dashoffset" values="0;-24" dur="1.1s" repeatCount="indefinite"/></path>
      <path d="M1010 180 L800 250" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.6;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- paketlar -->
    <circle r="4" fill="#60a5fa"><animateMotion dur="1.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#t1"/></animateMotion></circle>
    <circle r="4" fill="#34d399"><animateMotion dur="2.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#t3"/></animateMotion></circle>
    <circle r="4" fill="#60a5fa"><animateMotion dur="1.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#t4"/></animateMotion></circle>
    <circle r="4" fill="#34d399"><animateMotion dur="2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#t5"/></animateMotion></circle>
    <circle r="4" fill="#60a5fa" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.62;1" dur="8s" repeatCount="indefinite"/>
      <animateMotion dur="1.7s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#t2"/></animateMotion>
    </circle>

    <!-- markaz serveri -->
    <rect x="958" y="148" width="104" height="64" rx="12" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <rect x="972" y="162" width="76" height="8" rx="3" fill="#60a5fa"/>
    <rect x="972" y="176" width="76" height="8" rx="3" fill="#3b82f6" opacity=".7"/>
    <circle cx="978" cy="198" r="3.5" fill="#34d399"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle>
    <text class="tugun" x="1022" y="203" text-anchor="middle">markaz</text>

    <!-- MikroTik tugunlari -->
    <g>
      <rect x="784" y="62" width="72" height="36" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text class="tugun" x="820" y="85" text-anchor="middle">Ofis</text>
    </g>
    <g>
      <rect x="764" y="232" width="72" height="36" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2">
        <animate attributeName="stroke" values="#ef4444;#ef4444;#34d399;#34d399" keyTimes="0;0.55;0.6;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text class="tugun" x="800" y="255" text-anchor="middle">Ombor</text>
      <text class="kichik" x="800" y="290" text-anchor="middle" style="fill:#ef4444">uzildi
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.55;0.6;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text class="kichik" x="800" y="290" text-anchor="middle" style="fill:#34d399" opacity="0">ulandi
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.62;0.95;1" dur="8s" repeatCount="indefinite"/>
      </text>
    </g>
    <g>
      <rect x="1164" y="52" width="72" height="36" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text class="tugun" x="1200" y="75" text-anchor="middle">Filial</text>
    </g>
    <g>
      <rect x="1179" y="242" width="72" height="36" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text class="tugun" x="1215" y="265" text-anchor="middle">Savdo</text>
    </g>
    <g>
      <rect x="974" y="302" width="72" height="36" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text class="tugun" x="1010" y="325" text-anchor="middle">Sex</text>
    </g>

    <!-- kameralar (ikonka) -->
    <g fill="#94a3b8">
      <g transform="translate(866 64)"><rect width="18" height="12" rx="3"/><path d="M18 3l7-3v12l-7-3z"/></g>
      <g transform="translate(1136 56)"><rect width="18" height="12" rx="3"/><path d="M18 3l7-3v12l-7-3z"/></g>
      <g transform="translate(1150 288)"><rect width="18" height="12" rx="3"/><path d="M18 3l7-3v12l-7-3z"/></g>
    </g>
  </g>
</svg>
